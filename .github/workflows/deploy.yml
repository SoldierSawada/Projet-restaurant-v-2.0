name: Deploy

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.project }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.project }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3001' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
      - name: Déploiement en staging via SSM
        env:
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          CMD="sudo -u ubuntu -H bash -c 'set -e; cd /opt/restaurant; git fetch origin; git checkout -f $GITHUB_SHA; export IMAGE_TAG=$GITHUB_SHA; docker compose -p restaurant-staging -f docker-compose.deploy.yml -f docker-compose.staging.yml --env-file .env.deploy pull && docker compose -p restaurant-staging -f docker-compose.deploy.yml -f docker-compose.staging.yml --env-file .env.deploy up -d && docker compose -p restaurant-staging -f docker-compose.deploy.yml -f docker-compose.staging.yml --env-file .env.deploy ps'"
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "{\"commands\":[\"$CMD\"]}" --query Command.CommandId --output text)
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query '[StandardOutputContent,StandardErrorContent]' --output text
          test "$STATUS" = "Success"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
      - name: Déploiement en production via SSM
        env:
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          CMD="sudo -u ubuntu -H bash -c 'set -e; cd /opt/restaurant; git fetch origin; git checkout -f $GITHUB_SHA; export IMAGE_TAG=$GITHUB_SHA; docker compose -f docker-compose.deploy.yml --env-file .env.deploy pull && docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d && docker compose -f docker-compose.deploy.yml --env-file .env.deploy ps && docker image prune -f'"
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "{\"commands\":[\"$CMD\"]}" --query Command.CommandId --output text)
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query '[StandardOutputContent,StandardErrorContent]' --output text
          test "$STATUS" = "Success"
