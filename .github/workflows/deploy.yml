name: Deploy

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.project }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.project }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3001' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            cd /opt/restaurant
            git fetch origin
            git checkout -f "$GITHUB_SHA"
            export IMAGE_TAG="$GITHUB_SHA"
            docker compose -p restaurant-staging -f docker-compose.deploy.yml -f docker-compose.staging.yml --env-file .env.deploy pull
            docker compose -p restaurant-staging -f docker-compose.deploy.yml -f docker-compose.staging.yml --env-file .env.deploy up -d
            docker compose -p restaurant-staging -f docker-compose.deploy.yml -f docker-compose.staging.yml --env-file .env.deploy ps

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            cd /opt/restaurant
            git fetch origin
            git checkout -f "$GITHUB_SHA"
            export IMAGE_TAG="$GITHUB_SHA"
            docker compose -f docker-compose.deploy.yml --env-file .env.deploy pull
            docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d
            docker compose -f docker-compose.deploy.yml --env-file .env.deploy ps
            docker image prune -f
