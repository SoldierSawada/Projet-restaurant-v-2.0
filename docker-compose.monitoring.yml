services:
  prometheus:
    image: prom/prometheus:v3.11.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    networks:
      - monitoring-net
      - restaurant-net

  node-exporter:
    image: prom/node-exporter:v1.12.0
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:12.4.0
    restart: unless-stopped
    env_file:
      - .env.monitoring
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net

networks:
  monitoring-net:
  restaurant-net:
    external: true
    name: restaurant_default

volumes:
  prometheusdata:
  grafanadata:
