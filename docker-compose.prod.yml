services:
  backend:
    build:
      target: production
    restart: unless-stopped
    env_file:
      - .env.prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: "256M"
          cpus: "0.5"

  frontend:
    build:
      target: production
    ports:
      - "80:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: "128M"
          cpus: "0.25"

  db:
    restart: unless-stopped
    env_file:
      - .env.prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: "512M"
          cpus: "1.0"
