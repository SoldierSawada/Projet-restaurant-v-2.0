services:
  backend:
    image: ${GHCR_PREFIX:?GHCR_PREFIX manquant}/backend:${IMAGE_TAG:?IMAGE_TAG manquant}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.deploy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/status"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ${GHCR_PREFIX:?GHCR_PREFIX manquant}/frontend:${IMAGE_TAG:?IMAGE_TAG manquant}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env.deploy
    depends_on:
      backend:
        condition: service_healthy
